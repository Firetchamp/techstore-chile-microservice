# Configuración de la Base de Datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/techstore
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Credenciales de acceso
techstore.auth.username=admin@techstore.cl
techstore.auth.password=Admin1234

#Cambio de puerto del servidor
server.port=9090


# Tus credenciales locales de AWS Root / IAM para conectarse a tu SQS
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=us-east-2

# URL oficial de la cola que creamos en tu AWS SQS
aws.sqs.queue-url=https://sqs.us-east-2.amazonaws.com/169134208480/techstore-audit-queue