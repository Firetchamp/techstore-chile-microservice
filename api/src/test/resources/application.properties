# Base de datos en memoria (H2 o credenciales ficticias para que no falle el arranque)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Credenciales de simulación para AWS durante los Tests
spring.cloud.aws.credentials.access-key=MOCK_ACCESS_KEY
spring.cloud.aws.credentials.secret-key=MOCK_SECRET_KEY
spring.cloud.aws.region.static=us-east-2
aws.sqs.queue-url=https://sqs.us-east-2.amazonaws.com/123456789012/mock-queue

# Credenciales de acceso de la app
techstore.auth.username=admin@techstore.cl
techstore.auth.password=Admin1234
server.port=9090